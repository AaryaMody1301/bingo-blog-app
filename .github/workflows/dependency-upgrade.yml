name: Dependency upgrade

on:
  push:
    branches:
      - chore/upgrade-dependencies-2026-09

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/upgrade-dependencies-2026-09
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Commit generated lockfile and remove temporary workflow
        run: |
          rm .github/workflows/dependency-upgrade.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/dependency-upgrade.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: regenerate lockfile for dependency upgrades"
          git push
