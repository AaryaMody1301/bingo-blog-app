name: Finalize dependency upgrade

on:
  push:
    branches:
      - chore/upgrade-dependencies-2026-09

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4
        with:
          ref: chore/upgrade-dependencies-2026-09
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Commit lockfile and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/dependency-upgrade.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/dependency-upgrade.yml
          git commit -m "chore: regenerate lockfile for dependency upgrade"
          git push origin HEAD:chore/upgrade-dependencies-2026-09
